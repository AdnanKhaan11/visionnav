[project]
name = "visionnav"
version = "0.1.0"
description = "AI-powered GUI navigation agent — sees your screen, understands UI, controls mouse/keyboard"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{name = "Adnan Khaan"},{ name = "VisionNav Team" }]
keywords = ["gui-agent", "computer-use", "vision-language-model", "automation", "ai-agent"]

dependencies = [
    "transformers>=4.51.3",
    "qwen-vl-utils>=0.0.11",
    "accelerate>=1.2.1",
    "peft>=0.15.1",
    "torch>=2.3.0",
    "httpx>=0.27.0",
    "paddleocr>=2.7.0",
    "paddlepaddle>=3.3.1",
    "pytesseract>=0.3.10",
    "mss>=9.0.0",
    "pyautogui>=0.9.54",
    "pynput>=1.7.6",
    "Pillow>=11.0.0",
    "numpy>=1.26.0,<2.0.0",
    "opencv-python-headless>=4.10.0",
    "adbutils>=2.7.0",
    "uiautomator2>=3.2.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sqlmodel>=0.0.19",
    "aiosqlite>=0.20.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.0",
    "structlog>=24.1.0",
    "tenacity>=8.3.0",
    "imagehash>=4.3.1",
    "datasets>=4.0.0",
]

[project.optional-dependencies]
train = [
    "llamafactory @ git+https://github.com/hiyouga/LLaMA-Factory.git@main",
    "liger-kernel>=0.5.8",
    "wandb>=0.19.0",
    "datasets>=2.20.0",
    "albumentations>=1.3.0",
]
serve = [
    "vllm>=0.8.4",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "httpx>=0.27.0",
]
data = [
    "paddlepaddle>=2.6.0",
    "huggingface-hub>=0.23.0",
    "selenium>=4.32.0",
    "webdriver-manager>=4.0.2",
]

[project.scripts]
visionnav-api   = "visionnav.api.app:run_server"
visionnav-agent = "visionnav.agent.agent:run_cli"
visionnav-data  = "data_pipeline.pipeline:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/visionnav"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "data_pipeline", "training"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
ignore = ["B008", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["visionnav"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
exclude = ["notebooks/", "data_pipeline/", "training/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["--tb=short", "--strict-markers", "-q"]
markers = [
    "unit: fast isolated tests",
    "integration: requires running services",
    "e2e: full task execution in sandboxed environment",
    "slow: mark slow-running tests",
]

[tool.coverage.run]
source = ["src/visionnav"]
omit = ["tests/*", "notebooks/*"]

[tool.coverage.report]
fail_under = 70
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
